[package]
name = "jak-level-editor-core"
description = "The engine of Jak Level Editor: the document, its tools, the library, the export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "jle_core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# the textures of the glTF files (PNG, JPEG), written as PNG; an image as a shape's texture (also
# TGA, BMP)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
# nav meshes: Recast's Rust port, and the vectors of its API
rerecast = { version = "0.4.0", default-features = false, features = ["std"] }
glam = "0.32"
# the standalone app's OpenGOAL (tooling.rs): GitHub's releases, their archives; the OpenGOAL
# Launcher's own crates and backends, so that its build gets nothing more
reqwest = { version = "0.13", features = ["blocking"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = "0.4.43"
