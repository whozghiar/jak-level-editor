[workspace]
resolver = "3"
members = ["crates/core", "crates/tauri-plugin", "crates/mcp", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "ISC"
repository = "https://github.com/whozghiar/open-goal-level-builder"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: numbers read correctly rounded, as the C++ (strtod) read the game's data
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
tauri = { version = "2.11.2" }

[profile.dev.package."*"]
# the engine reads levels of tens of MB: its dependencies (image decoding...) optimized even in dev
opt-level = 2

[profile.dev.package.jak-level-editor-core]
opt-level = 2

[profile.release]
strip = true
